version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
  hive-metastore:
    image: apache/hive:4.0.0
    depends_on:
      - mysql
    environment:
      SERVICE_NAME: metastore
    ports:
      - "9083:9083"
  hive-server:
    image: apache/hive:4.0.0
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      # 把 HiveServer2 的 pid 文件放到 tmpfs 上：容器每次启动该目录都是空的，
      # 彻底避免"重启后 pid 文件残留、HiveServer2 误判已在运行而退出(Exited 1)"
      HIVESERVER2_PID_DIR: /tmp/hive-pid
    tmpfs:
      - /tmp/hive-pid
    ports:
      - "10000:10000"
      - "10002:10002"
